services:
  stm-contrib-api:
    image: ghcr.io/jerji/stm-contrib-server:latest
    container_name: stm-contrib-api
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - TZ=America/Montreal
    expose:
      - "8000"
    networks:
      - stm-contrib-net

  stm-contrib-caddy:
    image: caddy:2-alpine
    container_name: stm-contrib-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - stm-contrib-net
    depends_on:
      - stm-contrib-api

networks:
  stm-contrib-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config: